services:
  kafka:
    image: apache/kafka-native:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      # Configuración del proceso en modo KRaft (Sin Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
      # 🚨 MAPEO OFICIAL DE APACHE KAFKA (Usa los nombres exactos del estándar)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      
      # - PLAINTEXT_HOST (localhost:9092) -> Para tu IntelliJ local
      # - PLAINTEXT (kafka-broker:19092)   -> Para Kafka-UI dentro de Docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:19092,PLAINTEXT_HOST://localhost:9092
      
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # 🌟 CLAVE ADICIONAL: Fuerza a que el tópico de offsets no pida más réplicas de las que existen
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-componse
    ports:
      - "9096:8080"
    depends_on:
      - kafka
    environment:
      # Conectamos Kafka-UI usando la red interna de Docker y el nuevo puerto 29092
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:19092
